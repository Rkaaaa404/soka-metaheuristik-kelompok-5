plugins {
    id 'application'
    id 'java'
}

group = 'id.ac.soka.scheduling'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'com.github.Cloudslab.cloudsim:cloudsim:7.0.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'id.ac.soka.scheduling.App'
}

run {
    standardInput = System.in
    jvmArgs = ['-Dfile.encoding=UTF-8']
}

task runCli(type: JavaExec) {
    group = 'application'
    description = 'Menjalankan CloudSim Metaheuristic Benchmark di Terminal CLI'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'id.ac.soka.scheduling.App'
    standardInput = System.in
    jvmArgs = ['-Dfile.encoding=UTF-8']
    if (project.hasProperty('args')) {
        args = ['--cli'] + (project.property('args') as String).split('\\s+') as List
    } else {
        args = ['--cli']
    }
}

test {
    useJUnitPlatform()
}
